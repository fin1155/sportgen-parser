name: R checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpoppler-cpp-dev libcurl4-openssl-dev libssl-dev libxml2-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Parse application
        run: Rscript -e "parse('app.R')"
      - name: Run offline tests
        run: Rscript tests/run_tests.R

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t sportgen-parser:test .
      - name: Run offline tests in image
        run: docker run --rm sportgen-parser:test Rscript tests/run_tests.R
